name: Asset Service CI/CD Security


on:

  push:
    branches:
      - main
      - homework-final


  pull_request:
    branches:
      - main



jobs:


# ======================
# GO TEST
# ======================

  test:


    name: Go Test


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Setup Go

      uses: actions/setup-go@v5

      with:

        go-version: "1.24"



    - name: Download modules

      run: go mod download



    - name: Run tests

      run: go test ./...



    - name: Coverage

      run: go test -cover ./...




# ======================
# GOSEC
# ======================

  gosec:


    name: Gosec Security Scanner


    runs-on: ubuntu-latest



    steps:


    - uses: actions/checkout@v4



    - name: Install gosec

      run: |

        go install github.com/securego/gosec/v2/cmd/gosec@latest



    - name: Scan

      run: |

        gosec ./...





# ======================
# TRIVY FILESYSTEM
# ======================


  trivy:


    name: Trivy Vulnerability Scanner


    runs-on: ubuntu-latest


    steps:


    - uses: actions/checkout@v4



    - name: Trivy scan filesystem


      uses: aquasecurity/trivy-action@master


      with:


        scan-type: fs

        scan-ref: .

        severity: HIGH,CRITICAL

        exit-code: 0






# ======================
# DOCKER SCAN
# ======================


  docker:


    name: Docker Image Scan


    runs-on: ubuntu-latest


    steps:


    - uses: actions/checkout@v4



    - name: Build docker image


      run: |


        docker build -t asset-service .



    - name: Scan image


      uses: aquasecurity/trivy-action@master


      with:


        image-ref: asset-service

        severity: HIGH,CRITICAL

        exit-code: 0




# ======================
# GITLEAKS
# ======================


  gitleaks:


    name: Gitleaks Secret Detection


    runs-on: ubuntu-latest


    steps:


    - uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Detect secrets


      uses: gitleaks/gitleaks-action@v2
